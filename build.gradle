plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id 'dev.mixinmcp.decompile' version '1.0.3'
}

base {
    archivesName = "${fileName}-${mc_version}"
}

group = project.modGroup

repositories {
    mavenCentral()
    maven {
        url = "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
            includeGroup "snownee.jade"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {url = 'https://maven.nucleoid.xyz/releases'}
    maven {url = 'https://maven.blamejared.com'}
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    implementation "eu.pb4:trinkets:${trinkets_version}"
    localRuntime "mezz.jei:jei-${mc_version}-fabric:${jei_version}"
    localRuntime "curse.maven:jade-324717:8048381"
}

loom {
    accessWidenerPath = file("src/main/resources/placebo.accesswidener")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.javaVersion as int
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    def jv = JavaVersion.toVersion(project.javaVersion)
    sourceCompatibility = jv
    targetCompatibility = jv
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.modGroup
            artifactId = project.fileName
            version = "${mc_version}-${project.version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = "Muon"
            url = "https://maven.muon.rip/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
